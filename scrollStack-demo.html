<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ScrollStack Demo</title>
  <link rel="stylesheet" href="scrollStack.css">
  <style>
    body{margin:0;font-family:Inter,system-ui,Arial;background:#0b0b0b;color:#fff;padding:24px}
    .demo-wrap{max-width:1100px;margin:0 auto}
    h1{font-size:20px;margin-bottom:12px}
    .card-demo h3{margin:0 0 8px}
  </style>
</head>
<body>
  <div class="demo-wrap">
    <h1>ScrollStack — Demo (in-browser)</h1>
    <div id="root"></div>
  </div>

  <!-- React + ReactDOM (UMD) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel for in-browser JSX transpile (dev/demo only) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lenis UMD -->
  <script src="https://unpkg.com/@studio-freight/lenis/dist/lenis.umd.js"></script>

  <!-- Inline JSX demo: adapted from your ScrollStack component -->
  <script type="text/babel">
    const { useLayoutEffect, useRef, useCallback } = React;
    const Lenis = window.Lenis;

    function ScrollStack({ children, className = '' }) {
      const scrollerRef = useRef(null);
      const cardsRef = useRef([]);
      const lastTransformsRef = useRef(new Map());
      const animationFrameRef = useRef(null);
      const lenisRef = useRef(null);
      const isUpdatingRef = useRef(false);
      const stackCompletedRef = useRef(false);

      const parsePercentage = useCallback((value, containerHeight) => {
        if (typeof value === 'string' && value.includes('%')) {
          return (parseFloat(value) / 100) * containerHeight;
        }
        return parseFloat(value);
      }, []);

      const calculateProgress = useCallback((scrollTop, start, end) => {
        if (scrollTop < start) return 0;
        if (scrollTop > end) return 1;
        return (scrollTop - start) / (end - start);
      }, []);

      const getScrollData = useCallback(() => {
        const scroller = scrollerRef.current;
        return {
          scrollTop: scroller.scrollTop,
          containerHeight: scroller.clientHeight,
          scrollContainer: scroller
        };
      }, []);

      const getElementOffset = useCallback(element => element.offsetTop, []);

      const updateCardTransforms = useCallback(() => {
        if (!cardsRef.current.length || isUpdatingRef.current) return;
        isUpdatingRef.current = true;

        const { scrollTop, containerHeight } = getScrollData();
        const stackPositionPx = parsePercentage('20%', containerHeight);
        const scaleEndPositionPx = parsePercentage('10%', containerHeight);
        const itemStackDistance = 30;
        const itemScale = 0.03;
        const baseScale = 0.85;
        const rotationAmount = 0;
        const blurAmount = 0;

        const endElement = scrollerRef.current.querySelector('.scroll-stack-end');
        const endElementTop = endElement ? getElementOffset(endElement) : 0;

        cardsRef.current.forEach((card, i) => {
          if (!card) return;
          const cardTop = getElementOffset(card);
          const triggerStart = cardTop - stackPositionPx - itemStackDistance * i;
          const triggerEnd = cardTop - scaleEndPositionPx;
          const pinStart = triggerStart;
          const pinEnd = endElementTop - containerHeight / 2;

          const scaleProgress = calculateProgress(scrollTop, triggerStart, triggerEnd);
          const targetScale = baseScale + i * itemScale;
          const scale = 1 - scaleProgress * (1 - targetScale);
          const rotation = rotationAmount ? i * rotationAmount * scaleProgress : 0;

          let blur = 0;
          if (blurAmount) { /* omitted for demo */ }

          let translateY = 0;
          const isPinned = scrollTop >= pinStart && scrollTop <= pinEnd;
          if (isPinned) {
            translateY = scrollTop - cardTop + stackPositionPx + itemStackDistance * i;
          } else if (scrollTop > pinEnd) {
            translateY = pinEnd - cardTop + stackPositionPx + itemStackDistance * i;
          }

          const newTransform = {
            translateY: Math.round(translateY * 100) / 100,
            scale: Math.round(scale * 1000) / 1000,
            rotation: Math.round(rotation * 100) / 100,
            blur: Math.round(blur * 100) / 100
          };

          const lastTransform = lastTransformsRef.current.get(i);
          const hasChanged =
            !lastTransform ||
            Math.abs(lastTransform.translateY - newTransform.translateY) > 0.1 ||
            Math.abs(lastTransform.scale - newTransform.scale) > 0.001;

          if (hasChanged) {
            const transform = `translate3d(0, ${newTransform.translateY}px, 0) scale(${newTransform.scale}) rotate(${newTransform.rotation}deg)`;
            const filter = newTransform.blur > 0 ? `blur(${newTransform.blur}px)` : '';
            card.style.transform = transform;
            card.style.filter = filter;
            lastTransformsRef.current.set(i, newTransform);
          }

          if (i === cardsRef.current.length - 1) {
            const isInView = scrollTop >= pinStart && scrollTop <= pinEnd;
            if (isInView && !stackCompletedRef.current) {
              stackCompletedRef.current = true;
            } else if (!isInView && stackCompletedRef.current) {
              stackCompletedRef.current = false;
            }
          }
        });

        isUpdatingRef.current = false;
      }, [calculateProgress, getScrollData, getElementOffset, parsePercentage]);

      const handleScroll = useCallback(() => {
        updateCardTransforms();
      }, [updateCardTransforms]);

      const setupLenis = useCallback(() => {
        const scroller = scrollerRef.current;
        if (!scroller) return;
        const lenis = new Lenis({
          wrapper: scroller,
          content: scroller.querySelector('.scroll-stack-inner'),
          duration: 1.2,
          easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
          smoothWheel: true,
          touchMultiplier: 2,
          infinite: false,
          gestureOrientationHandler: true,
          normalizeWheel: true,
          wheelMultiplier: 1,
          lerp: 0.1,
          syncTouch: true,
          syncTouchLerp: 0.075
        });
        lenis.on('scroll', handleScroll);
        const raf = time => { lenis.raf(time); animationFrameRef.current = requestAnimationFrame(raf); };
        animationFrameRef.current = requestAnimationFrame(raf);
        lenisRef.current = lenis;
        return lenis;
      }, [handleScroll]);

      useLayoutEffect(() => {
        const scroller = scrollerRef.current;
        if (!scroller) return;

        const cards = Array.from(scroller.querySelectorAll('.scroll-stack-card'));
        cardsRef.current = cards;
        cards.forEach((card, i) => {
          if (i < cards.length - 1) card.style.marginBottom = `${100}px`;
          card.style.willChange = 'transform, filter';
          card.style.transformOrigin = 'top center';
        });

        setupLenis();
        updateCardTransforms();

        const onResize = () => { updateCardTransforms(); };
        window.addEventListener('resize', onResize);

        return () => {
          if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
          if (lenisRef.current) lenisRef.current.destroy();
          window.removeEventListener('resize', onResize);
          cardsRef.current = [];
        };
      }, [setupLenis, updateCardTransforms]);

      return (
        <div ref={scrollerRef} className={`scroll-stack-scroller ${className}`}>
          <div className="scroll-stack-inner">
            {children}
            <div className="scroll-stack-end" />
          </div>
        </div>
      );
    }

    function Demo() {
      return (
        <ScrollStack>
          <div className="scroll-stack-card card-demo" style={{background:'linear-gradient(90deg,#3b82f6,#7c3aed)', color:'#111'}}>
            <h3>Card One</h3>
            <p>Primary visual — top of stack.</p>
          </div>
          <div className="scroll-stack-card card-demo" style={{background:'linear-gradient(90deg,#ff7a18,#af002d)', color:'#111'}}>
            <h3>Card Two</h3>
            <p>Secondary visual.</p>
          </div>
          <div className="scroll-stack-card card-demo" style={{background:'linear-gradient(90deg,#00e5ff,#7c3aed)', color:'#111'}}>
            <h3>Card Three</h3>
            <p>Tertiary visual.</p>
          </div>
          <div className="scroll-stack-card card-demo" style={{background:'linear-gradient(90deg,#ffd86f,#ff8a00)', color:'#111'}}>
            <h3>Card Four</h3>
            <p>Footer card to release stack.</p>
          </div>
        </ScrollStack>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Demo />);
  </script>
</body>
</html>
